stardis_config_version: 1.0
atom_data: ../data/kurucz_cd23_chianti_H_He.h5
n_threads: -99
input_model:
    type: marcs
    fname: ../data/parameters/s3000_g+1.0_m1.0_t01_st_z+0.00_a+0.00_c+0.00_n+0.00_o+0.00_r+0.00_s+0.00.mod.gz
    gzipped: True
    final_atomic_number: 30
#   composition_source: "asplund_2020"
plasma:
    nlte_ionization_species: []
opacity:
    file:
        Hminus_bf: ../data/h_minus_cross_section_wbr.dat
        H2plus_bf: ../data/h2_plus_bf.dat
        Hminus_ff: ../data/h_minus_ff.dat
    bf:
        H_I: {}
    ff:
        H_I: {}
    disable_electron_scattering: False
    line:
        disable: True
        broadening: [radiation, linear_stark, quadratic_stark, van_der_waals]
        include_molecules: False
no_of_thetas: 20
result_options:
    return_plasma: True
    return_model: True
